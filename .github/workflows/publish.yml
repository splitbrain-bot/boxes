# CI workflow: runs the test suites, builds the three Boxes images, runs the
# security smoke test against them, and publishes them to GHCR on every push
# to main. A pull request builds and tests the images without pushing them.
#
#   ghcr.io/<owner>/boxes/orchestrator   API, dashboard, gateway, Docker client
#   ghcr.io/<owner>/boxes/egress-proxy   the only way out of a box network
#   ghcr.io/<owner>/boxes/box            what a box container runs
#
# Every image gets latest and an immutable sha-<short> tag. The test job gates
# the build and the smoke test gates the publishing, because something else
# deploys latest unattended.

name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Of two quick pushes, only the second one's images are worth building.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      # One failing suite says more when the other two have still run.
      fail-fast: false
      matrix:
        package: [orchestrator, proxy, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          # Every lock file, because the dashboard job also installs the
          # orchestrator's dependencies.
          cache-dependency-path: '*/package-lock.json'

      # ci, so the suites run the lock file versions the Dockerfiles build.
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      # The dashboard's browser suite runs the real orchestrator in process,
      # so its type check and tests need the orchestrator's dependencies.
      - name: Install orchestrator dependencies
        if: matrix.package == 'dashboard'
        working-directory: orchestrator
        run: npm ci

      # The dashboard's e2e project drives the production bundle in a real
      # Chromium.
      #
      # --with-deps runs apt-get update. The runner image lists Google's
      # Chrome repository, which Chromium's libraries do not come from. That
      # repository has served an index with a wrong hash, and one bad index
      # fails the whole update, so the step removes it first. The glob covers
      # both the .list and the .sources file.
      - name: Install Chromium
        if: matrix.package == 'dashboard'
        working-directory: dashboard
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      - name: Type-check
        working-directory: ${{ matrix.package }}
        run: npm run check

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  images:
    name: image (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Dockerfiles copy shared/ next to their own package, so the
          # context is the repository root.
          - image: orchestrator
            context: .
            dockerfile: orchestrator/Dockerfile
          - image: egress-proxy
            context: .
            dockerfile: proxy/Dockerfile
          # The box image copies only files from box-image/.
          - image: box
            context: box-image
            dockerfile: box-image/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Derived from the repository, so a fork publishes to its own
      # namespace. GHCR needs lowercase names, and github.repository is
      # lowercase.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-${{ matrix.image }}

      # Written to a file instead of pushed, so the smoke test runs the same
      # image the publish job uploads. The tags are computed on a pull
      # request too, so it tests everything but the upload.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image }}.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The deployment host runs linux/amd64.
          platforms: linux/amd64
          # One cache scope per image, so the builds do not evict each
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # A plain single-platform manifest, because watchtower compares the
          # digest to decide whether an image is new.
          provenance: false
          sbom: false

      # Kept for one day, because only the later jobs of this run need it.
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.image }}
          path: ${{ runner.temp }}/${{ matrix.image }}.tar
          if-no-files-found: error
          retention-days: 1

  # Checks the isolation of a box on a real Docker host, with the images this
  # run built.
  smoke:
    name: smoke test
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      # Compose looks for the image of a service under the name it would
      # build it as, so the orchestrator and the proxy get those names. The
      # box image under test is on no registry, so the orchestrator must never
      # pull it. Each file is removed once loaded, to save the runner's disk.
      # BOXES_ENV points compose at the settings file for the later steps.
      - name: Load the images
        run: |
          set -eu
          BOXES_ENV="$RUNNER_TEMP/boxes.env"
          echo "BOXES_ENV=$BOXES_ENV" >> "$GITHUB_ENV"
          load() {
            docker load -i "$RUNNER_TEMP/images/$1.tar" | sed -n 's/^Loaded image: //p' | head -1
            rm "$RUNNER_TEMP/images/$1.tar"
          }
          docker tag "$(load orchestrator)" boxes-orchestrator
          docker tag "$(load egress-proxy)" boxes-egress-proxy
          echo "BOX_IMAGE=$(load box)" >> "$BOXES_ENV"
          echo "BOX_IMAGE_PULL_MINUTES=0" >> "$BOXES_ENV"

      - name: Start the stack
        run: |
          set -eu
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3000/healthz; then exit 0; fi
            sleep 2
          done
          echo 'The orchestrator did not answer on /healthz.'
          exit 1

      - name: Run the smoke test
        run: ./tests/smoke-test.sh

      - name: Show the logs of the stack
        if: failure()
        run: docker compose logs

  # Pushes the images the smoke test ran, so what is published is what was
  # tested.
  publish:
    name: publish
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images
        run: |
          set -eu
          for image in orchestrator egress-proxy box; do
            docker load -i "$RUNNER_TEMP/images/$image.tar"
            rm "$RUNNER_TEMP/images/$image.tar"
            docker push --all-tags "$REGISTRY/${{ github.repository }}/$image"
          done

  # Tells the deployment's watchtower to pull at once, instead of at its next
  # poll.
  watchtower:
    name: watchtower
    needs: publish
    # A partly failed push skips this job, because a mix of new and old
    # images needs fixing rather than deploying.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Without a WATCHTOWER_URL, as in a fork, the step succeeds with a
      # note. WATCHTOWER_URL is a repository variable, because it is not a
      # credential. The token is a secret.
      - name: Ask watchtower to pull what was just published
        env:
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        # set -eu and the :- defaults keep the script's behaviour the same
        # outside the runner.
        run: |
          set -eu
          url=${WATCHTOWER_URL:-}
          if [ -z "$url" ]; then
            echo 'No WATCHTOWER_URL variable set; nothing to notify.'
            exit 0
          fi
          # --fail turns a refused ping into a red check. Watchtower answers
          # only after it has pulled and recreated its containers, so the
          # timeout is minutes long.
          answer=$(curl --fail --silent --show-error --max-time 300 \
            -X POST "$url" \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN:-}")
          # The only record of the deployment moving.
          printf 'Watchtower answered: %s\n' "$answer"
