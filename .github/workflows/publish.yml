# The CI workflow, which tests the code, builds and tests the four Boxes images,
# and publishes them to GHCR on a push to main or a manual run. A pull request
# builds and tests the images without pushing them.
#
#   ghcr.io/<owner>/boxes/orchestrator   API, dashboard, gateway, Docker client
#   ghcr.io/<owner>/boxes/egress-proxy   the only way out of a box network
#   ghcr.io/<owner>/boxes/box-base       what a box needs, for custom images
#   ghcr.io/<owner>/boxes/box            the base with the tools for projects
#
# The build cache of main is in ghcr.io/<owner>/boxes/cache, one tag per image.
#
# Every image gets an immutable sha-<short> tag, and the default branch also
# gets latest. The lint and test jobs gate the build, and the smoke test gates
# the publishing, because a watchtower deploys latest unattended.

name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new run on the same ref cancels the run before it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # Biome is one binary with its own lock file at the root, so the job
  # installs nothing else.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Biome
        run: npm ci

      - name: Check formatting and lint
        run: npx biome ci .

  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      # One failing suite says more when the others have still run.
      fail-fast: false
      matrix:
        package: [orchestrator, proxy, files, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          # Every lock file, because the orchestrator and dashboard jobs also
          # install the dependencies of other packages.
          cache-dependency-path: '*/package-lock.json'

      # npm ci, so the suites run the lock file versions that the Dockerfiles
      # build.
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      # The dashboard's browser suite runs the real orchestrator in process,
      # so its type check and tests need the orchestrator's dependencies.
      - name: Install orchestrator dependencies
        if: matrix.package == 'dashboard'
        working-directory: orchestrator
        run: npm ci

      # The orchestrator's tests run the file service in process, so its
      # type check and tests, and the dashboard's with it, need the file
      # service's dependencies.
      - name: Install file service dependencies
        if: matrix.package == 'orchestrator' || matrix.package == 'dashboard'
        working-directory: files
        run: npm ci

      # The dashboard's e2e project drives the production bundle in a real
      # Chromium.
      #
      # --with-deps runs apt-get update. The runner image lists Google's
      # Chrome repository, which Chromium's libraries do not come from. One bad
      # index of a repository fails the whole update, so the step removes that
      # repository first. The glob covers both the .list and the .sources file.
      - name: Install Chromium
        if: matrix.package == 'dashboard'
        working-directory: dashboard
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      - name: Type-check
        working-directory: ${{ matrix.package }}
        run: npm run check

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  # One job builds the images, runs the smoke test and publishes, so the
  # images never leave the runner between those steps. The builder keeps
  # every layer it built, so the publishing steps export from it without a
  # second build.
  images:
    name: images
    needs: [test, lint]
    runs-on: ubuntu-latest
    # A push to main writes the build cache to GHCR, and a push or a manual
    # run writes the images. The token of a pull request from a fork can only
    # read.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived from the repository, so a fork publishes to its own
      # namespace. GHCR needs lowercase names, and the owner of a fork can
      # have capital letters, so the step lowercases the repository.
      - name: Name the images
        run: echo "IMAGE_BASE=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # The tags are computed on a pull request too, so it tests everything
      # but the upload.
      - id: orchestrator-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}/orchestrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-orchestrator

      - id: egress-proxy-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}/egress-proxy
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-egress-proxy

      - id: box-base-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}/box-base
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-box-base

      - id: box-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BASE }}/box
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-box

      # Each build loads its image into the Docker daemon for the smoke test.
      # Each Dockerfile copies shared/ next to its own package, so the
      # context is the repository root. The deployment host runs linux/amd64.
      #
      # Main writes the cache to the registry, which a pull request can read
      # and which does not count against the cache limit of GitHub Actions.
      # A pull request writes its own layers to the cache of GitHub Actions,
      # so its next push reuses them. One cache per image, so the builds do
      # not evict each other's layers.
      #
      # A plain single-platform manifest, because watchtower compares the
      # digest to decide whether an image is new.
      #
      # Compose looks for the image of a service under the name it would
      # build it as, so the orchestrator and the proxy get those names too.
      - name: Build the orchestrator image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: orchestrator/Dockerfile
          load: true
          tags: |
            ${{ steps.orchestrator-meta.outputs.tags }}
            boxes-orchestrator
          labels: ${{ steps.orchestrator-meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.IMAGE_BASE }}/cache:orchestrator
            type=gha,scope=orchestrator
          cache-to: >-
            ${{ github.event_name == 'push'
            && format('type=registry,ref={0}/cache:orchestrator,mode=max', env.IMAGE_BASE)
            || 'type=gha,mode=max,scope=orchestrator' }}
          provenance: false
          sbom: false

      - name: Build the egress proxy image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy/Dockerfile
          load: true
          tags: |
            ${{ steps.egress-proxy-meta.outputs.tags }}
            boxes-egress-proxy
          labels: ${{ steps.egress-proxy-meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.IMAGE_BASE }}/cache:egress-proxy
            type=gha,scope=egress-proxy
          cache-to: >-
            ${{ github.event_name == 'push'
            && format('type=registry,ref={0}/cache:egress-proxy,mode=max', env.IMAGE_BASE)
            || 'type=gha,mode=max,scope=egress-proxy' }}
          provenance: false
          sbom: false

      # The full image builds on every stage of the base, its checks
      # included, so this one build also covers the base image. The smoke
      # test does not use the base image, so only the full one is loaded.
      - name: Build the box image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: box-image/Dockerfile
          target: full
          load: true
          tags: ${{ steps.box-meta.outputs.tags }}
          labels: ${{ steps.box-meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: |
            type=registry,ref=${{ env.IMAGE_BASE }}/cache:box
            type=gha,scope=box
          cache-to: >-
            ${{ github.event_name == 'push'
            && format('type=registry,ref={0}/cache:box,mode=max', env.IMAGE_BASE)
            || 'type=gha,mode=max,scope=box' }}
          provenance: false
          sbom: false

      # The runtime conformance suites run from the orchestrator package.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - name: Install orchestrator dependencies
        working-directory: orchestrator
        run: npm ci

      # The conformance suite checks the Kubernetes runtime against a kind
      # cluster and the images this job built. kind enforces NetworkPolicy
      # with its default network plugin. The images are on no registry, so
      # they are loaded into the node, and nothing pulls them. It runs before
      # the Docker suite, which runs as root and leaves files of root in
      # node_modules.
      - name: Create the kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: boxes

      - name: Load the images into kind
        run: kind load docker-image --name boxes "$BOX_IMAGE" "$PROXY_IMAGE"
        env:
          BOX_IMAGE: ${{ env.IMAGE_BASE }}/box:${{ steps.box-meta.outputs.version }}
          PROXY_IMAGE: ${{ env.IMAGE_BASE }}/egress-proxy:${{ steps.egress-proxy-meta.outputs.version }}

      # The namespace and the proxy of the manifests, with the image this job
      # built. The suite runs in the namespace of the current context.
      - name: Start the egress proxy in kind
        run: |
          set -eu
          kubectl apply -f k8s/namespace.yaml
          kubectl config set-context --current --namespace=boxes
          kubectl apply -f k8s/egress-proxy.yaml
          kubectl patch deployment boxes-egress-proxy --type=json -p "$(jq -nc --arg image "$PROXY_IMAGE" '[
            {op: "replace", path: "/spec/template/spec/containers/0/image", value: $image},
            {op: "add", path: "/spec/template/spec/containers/0/imagePullPolicy", value: "IfNotPresent"}
          ]')"
          kubectl rollout status deployment/boxes-egress-proxy --timeout=180s
        env:
          PROXY_IMAGE: ${{ env.IMAGE_BASE }}/egress-proxy:${{ steps.egress-proxy-meta.outputs.version }}

      - name: Run the runtime conformance suite on Kubernetes
        working-directory: orchestrator
        run: npm run test:conformance -- kubernetes
        env:
          BOXES_CONFORMANCE_CONTEXT: kind-boxes
          BOX_IMAGE: ${{ env.IMAGE_BASE }}/box:${{ steps.box-meta.outputs.version }}
          BOX_IMAGE_PULL_POLICY: IfNotPresent

      - name: Show the state of the kind cluster
        if: failure()
        run: |
          kubectl get pods,services,networkpolicies,persistentvolumeclaims -o wide
          kubectl describe pods
          kubectl logs deployment/boxes-egress-proxy

      # The conformance suite checks the Docker runtime against this daemon
      # and the box image this job built. It needs the proxy of the stack,
      # and it runs before the orchestrator starts, because the orphan sweep
      # of the orchestrator removes the boxes of the suite. It runs as root,
      # as the orchestrator does in its container, so that it can give the
      # new box directories to the box user. sudo resets PATH, so the PATH of
      # setup-node is passed on.
      - name: Start the egress proxy
        run: docker compose up -d --no-build egress-proxy

      - name: Run the runtime conformance suite on Docker
        working-directory: orchestrator
        run: sudo --preserve-env env "PATH=$PATH" npm run test:conformance -- docker
        env:
          BOX_IMAGE: ${{ env.IMAGE_BASE }}/box:${{ steps.box-meta.outputs.version }}

      # Checks the isolation of a box on a real Docker host, with the images
      # this job built. The box image under test is on no registry, so the
      # orchestrator must never pull it. BOXES_ENV points compose at the
      # settings file for the later steps. /healthz answers while the
      # orchestrator boots, so the step waits for /readyz.
      - name: Start the stack
        run: |
          set -eu
          export BOXES_ENV="$RUNNER_TEMP/boxes.env"
          echo "BOXES_ENV=$BOXES_ENV" >> "$GITHUB_ENV"
          echo "BOX_IMAGE=$BOX_IMAGE" >> "$BOXES_ENV"
          echo "BOX_IMAGE_PULL_MINUTES=0" >> "$BOXES_ENV"
          docker compose up -d --no-build
          for _ in $(seq 1 60); do
            if curl -fs -o /dev/null http://localhost:3000/readyz; then exit 0; fi
            sleep 2
          done
          echo 'The orchestrator did not get ready on /readyz.'
          exit 1
        env:
          BOX_IMAGE: ${{ env.IMAGE_BASE }}/box:${{ steps.box-meta.outputs.version }}

      - name: Run the smoke test
        run: ./tests/smoke-test.sh

      - name: Show the logs of the stack
        if: failure()
        run: docker compose logs

      # Pushes the images the smoke test ran. Every layer is in the builder
      # from the builds above, so these steps only export and upload. The
      # base image is pushed from the stages the box build already built.
      - name: Push the orchestrator image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: orchestrator/Dockerfile
          push: true
          tags: ${{ steps.orchestrator-meta.outputs.tags }}
          labels: ${{ steps.orchestrator-meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Push the egress proxy image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: proxy/Dockerfile
          push: true
          tags: ${{ steps.egress-proxy-meta.outputs.tags }}
          labels: ${{ steps.egress-proxy-meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Push the base box image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: box-image/Dockerfile
          target: base
          push: true
          tags: ${{ steps.box-base-meta.outputs.tags }}
          labels: ${{ steps.box-base-meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Push the box image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: box-image/Dockerfile
          target: full
          push: true
          tags: ${{ steps.box-meta.outputs.tags }}
          labels: ${{ steps.box-meta.outputs.labels }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      # Each cache export moves its tag and leaves the old manifest as an
      # untagged version. The newest untagged versions stay, because a build
      # that started before the export can still read them. The repository
      # that published the package has admin access to it, so the token can
      # delete versions.
      - name: Delete old build caches
        if: github.event_name == 'push'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}/cache
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 3

  # Tells the watchtower of the deployment to pull the new images at once.
  watchtower:
    name: watchtower
    needs: images
    # A partly failed push skips this job, because a mix of new and old
    # images needs fixing rather than deploying.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Without a WATCHTOWER_URL, as in a fork, the step succeeds with a
      # note. WATCHTOWER_URL is a repository variable, because it is not a
      # credential. The token is a secret.
      - name: Ask watchtower to pull what was just published
        env:
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        # set -eu and the :- defaults keep the script's behaviour the same
        # outside the runner.
        run: |
          set -eu
          url=${WATCHTOWER_URL:-}
          if [ -z "$url" ]; then
            echo 'No WATCHTOWER_URL variable set; nothing to notify.'
            exit 0
          fi
          # --fail turns a refused ping into a red check. Watchtower answers
          # only after it has pulled and recreated its containers, so the
          # timeout is minutes long.
          answer=$(curl --fail --silent --show-error --max-time 300 \
            -X POST "$url" \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN:-}")
          # The answer is the only record of the deployment.
          printf 'Watchtower answered: %s\n' "$answer"
