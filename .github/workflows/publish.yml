# CI workflow: runs the test suites, builds the three Boxes images, and
# publishes them to GHCR on every push to main. A pull request builds the
# images without pushing them.
#
#   ghcr.io/<owner>/boxes/orchestrator   API, dashboard, gateway, Docker client
#   ghcr.io/<owner>/boxes/egress-proxy   the only way out of a box network
#   ghcr.io/<owner>/boxes/box            what a box container runs
#
# Every image gets latest and an immutable sha-<short> tag. The test job gates
# the build, because something else deploys latest unattended.

name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Of two quick pushes, only the second one's images are worth building.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      # One failing suite says more when the other two have still run.
      fail-fast: false
      matrix:
        package: [orchestrator, proxy, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          # Every lock file, because the dashboard job also installs the
          # orchestrator's dependencies.
          cache-dependency-path: '*/package-lock.json'

      # ci, so the suites run the lock file versions the Dockerfiles build.
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      # The dashboard's browser suite runs the real orchestrator in process,
      # so its type check and tests need the orchestrator's dependencies.
      - name: Install orchestrator dependencies
        if: matrix.package == 'dashboard'
        working-directory: orchestrator
        run: npm ci

      # The dashboard's e2e project drives the production bundle in a real
      # Chromium.
      #
      # --with-deps runs apt-get update. The runner image lists Google's
      # Chrome repository, which Chromium's libraries do not come from. That
      # repository has served an index with a wrong hash, and one bad index
      # fails the whole update, so the step removes it first. The glob covers
      # both the .list and the .sources file.
      - name: Install Chromium
        if: matrix.package == 'dashboard'
        working-directory: dashboard
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*
          npx playwright install --with-deps chromium

      - name: Type-check
        working-directory: ${{ matrix.package }}
        run: npm run check

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

  images:
    name: image (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Dockerfiles copy shared/ next to their own package, so the
          # context is the repository root.
          - image: orchestrator
            context: .
            dockerfile: orchestrator/Dockerfile
          - image: egress-proxy
            context: .
            dockerfile: proxy/Dockerfile
          # The box image copies only files from box-image/.
          - image: box
            context: box-image
            dockerfile: box-image/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Skipped on a pull request: nothing is pushed, and a pull request from
      # a fork has no token that could log in.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derived from the repository, so a fork publishes to its own
      # namespace. GHCR needs lowercase names, and github.repository is
      # lowercase.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.title=boxes-${{ matrix.image }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # The tags are computed on a pull request too, so it tests
          # everything but the upload.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The deployment host runs linux/amd64.
          platforms: linux/amd64
          # One cache scope per image, so the builds do not evict each
          # other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # A plain single-platform manifest, because watchtower compares the
          # digest to decide whether an image is new.
          provenance: false
          sbom: false

  # Tells the deployment's watchtower to pull at once, instead of at its next
  # poll.
  watchtower:
    name: watchtower
    needs: images
    # A partly failed image matrix skips this job, because a mix of new and
    # old images needs fixing rather than deploying.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Without a WATCHTOWER_URL, as in a fork, the step succeeds with a
      # note. WATCHTOWER_URL is a repository variable, because it is not a
      # credential. The token is a secret.
      - name: Ask watchtower to pull what was just published
        env:
          WATCHTOWER_URL: ${{ vars.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_HTTP_API_TOKEN }}
        # set -eu and the :- defaults keep the script's behaviour the same
        # outside the runner.
        run: |
          set -eu
          url=${WATCHTOWER_URL:-}
          if [ -z "$url" ]; then
            echo 'No WATCHTOWER_URL variable set; nothing to notify.'
            exit 0
          fi
          # --fail turns a refused ping into a red check. Watchtower answers
          # only after it has pulled and recreated its containers, so the
          # timeout is minutes long.
          answer=$(curl --fail --silent --show-error --max-time 300 \
            -X POST "$url" \
            -H "Authorization: Bearer ${WATCHTOWER_TOKEN:-}")
          # The only record of the deployment moving.
          printf 'Watchtower answered: %s\n' "$answer"
