# Local development: run the whole stack without Traefik.
#
#   docker compose -f compose.yaml -f compose.local.yaml up -d
#   -> http://localhost:3000
#
# The orchestrator serves the dashboard, the API, the /ws gateway and acp-ui at
# /ui, so one published port is the entire deployment. Nothing needs a reverse
# proxy, and nothing needs configuring: the dashboard derives the WebSocket URL
# from the browser's own location.
#
# This override has no basicauth, because Traefik is what provides it, which
# is why it binds to loopback. Do not use it on a shared or exposed host.

services:
  orchestrator:
    networks: !override
      - default
    ports:
      - "127.0.0.1:3000:3000"
    labels: !reset null
