# The way in to the dashboard, the API and the WebSocket on /ws.
#
# The orchestrator has no authentication of its own. This Ingress is not
# safe until the annotations below put authentication in front of it, for
# example the basic auth or the external auth of the ingress controller.
# Without an Ingress, `kubectl port-forward service/boxes-orchestrator 3000`
# reaches the orchestrator.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boxes-orchestrator
  annotations:
    # The authentication of the ingress controller, for example for
    # ingress-nginx:
    #
    #   nginx.ingress.kubernetes.io/auth-type: basic
    #   nginx.ingress.kubernetes.io/auth-secret: boxes-basic-auth
    #
    # An upload can be as large as MAX_ATTACHMENT_MB.
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    # A terminal or a thread can be quiet for a long time on /ws.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: boxes.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boxes-orchestrator
                port:
                  name: http
