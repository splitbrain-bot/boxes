# Codex system configuration for a box. An agent's own
# $CODEX_HOME/config.toml overrides it.

# A copy of the built-in OpenAI provider without WebSocket support. The egress
# proxy refuses a protocol upgrade on a host whose credential it swaps. With
# the built-in provider, Codex retries the upgrade, falls back to HTTPS and
# warns in every thread.
model_provider = "openai-https"

# No attribution trailer naming Codex in the commits an agent makes.
commit_attribution = ""

# Codex recognises its own provider by this name. No base URL is set, so the
# login decides the endpoint: api.openai.com for an API key, chatgpt.com for
# a subscription.
[model_providers.openai-https]
name = "OpenAI"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false
supports_standalone_web_search = true
