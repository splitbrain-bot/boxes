# The system nix configuration of a box, with one user, one store and no daemon.
# An agent's own ~/.config/nix/nix.conf is read on top of it.

# The orchestrator binds in a /nix of the box's own, owned by the agent, so
# nix runs in single-user mode without build users.
build-users-group =

# The bind starts out empty. With store = auto, nix finds no /nix/var/nix and
# falls back to a chroot store under the home. That store needs user
# namespaces, which the box does not have. With the store named, nix creates
# the store in /nix on first use.
store = local

# The build sandbox needs user namespaces, which a box without capabilities
# does not have. A local build therefore runs impurely as the agent.
sandbox = false

# The nix command and flakes, which the nix-path below relies on.
experimental-features = nix-command flakes

# Legacy commands such as nix-shell -p resolve <nixpkgs> through the flake
# registry, so they work without a channel or a NIX_PATH.
nix-path = nixpkgs=flake:nixpkgs

# Profiles go under ~/.local/state/nix, where the image's PATH expects them.
use-xdg-base-directories = true

# boxes-setup writes this bundle with the system authorities and the
# deployment CA. The static nix trusts only this one file, and the hosts the
# proxy translates credentials for present the deployment CA.
ssl-cert-file = /home/agent/.boxes/ca-bundle.crt
