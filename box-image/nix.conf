# Nix in a box: one user, one store, no daemon.
#
# The system configuration, read below the one an agent may write in its own
# ~/.config/nix/nix.conf: what a box needs to work is here, and what an agent
# prefers stays its own.

# /nix is a directory of the box's own that the orchestrator binds in, owned
# by the agent, so nix runs in single-user mode: no daemon, and no group of
# build users to hand builds to.
build-users-group =

# A box drops every capability and so has no user namespaces, which the
# build sandbox needs. Without it, a local build runs as the agent in the
# agent's own environment. The binary cache covers nearly everything an agent
# asks for; what it does not is built here impurely, which for a box is fine.
sandbox = false

# The command an agent reaches for, and the flake registry it resolves
# `nixpkgs` through.
experimental-features = nix-command flakes

# `<nixpkgs>` -- what nix-shell -p and every other legacy command look up --
# is the same nixpkgs the flake registry names, so neither a channel nor a
# NIX_PATH has to be set up before the first `nix-shell -p` works.
nix-path = nixpkgs=flake:nixpkgs

# Profiles under ~/.local/state/nix rather than as ~/.nix-profile, so what
# the agent installed sits in its home beside everything else it owns.
use-xdg-base-directories = true

# Every download nix makes is over TLS, and the hosts the egress proxy
# translates credentials for present the deployment's own certificate. The
# bundle the entrypoint writes carries the system authorities and that CA
# both; the CA alone would fail every host the proxy tunnels untouched, which
# is most of them, and the static build of nix has no directory of
# authorities to fall back on.
ssl-cert-file = /home/agent/.boxes/ca-bundle.crt
