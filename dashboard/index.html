<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- interactive-widget: the on-screen keyboard shrinks the viewport.
         Otherwise the browser scrolls the one-viewport-tall document to show
         a focused composer, and the header scrolls out of view. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark light" />
    <!-- On iOS, the Notification and Push APIs exist only for a page added
         to the Home Screen.

         use-credentials sends the cookie with the manifest request. Without
         it, an authenticating reverse proxy refuses the manifest, and the
         browser never offers to install the app. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- iOS offers Add to Home Screen even when the manifest failed to load.
         These tags make the app standalone without the manifest. The title
         tag stops iOS from naming the app after the document title, which
         follows the open thread. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Boxes" />
    <!-- One per scheme, so the browser chrome follows the phone's setting. -->
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <title>Boxes</title>
    <!-- The orchestrator's content security policy allows this script by
         its SHA-256 in THEME_SCRIPT_HASH. Any change to the script, including
         its comments, needs a new hash there. -->
    <script>
      // Applied before first paint, so the page never flashes the wrong
      // scheme, and again on every change, so switching the phone between
      // light and dark does not need a reload. Tailwind's dark variant is the
      // .dark class (globals.css).
      try {
        var scheme = window.matchMedia('(prefers-color-scheme: dark)');
        var apply = function () {
          document.documentElement.classList.toggle('dark', scheme.matches);
        };
        apply();
        scheme.addEventListener('change', apply);
      } catch (e) {
        /* matchMedia is absent in some embedded browsers */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
