# Boxes: personal AI agent orchestrator.
#
#   docker compose up -d     ->  http://localhost:3000
#
# The whole deployment is one published port: the orchestrator serves the
# dashboard, the API and the /ws gateway on it. Putting it on the internet is
# a reverse proxy's job, and no proxy is named here — see README.md, which
# covers the one rule any of them has to follow about /ws.
#
# The orchestrator creates session containers at runtime, each on an internal
# network of its own, so they appear in no compose file.

name: boxes

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: boxes-orchestrator
    restart: unless-stopped
    # Whatever is in the env file reaches the orchestrator, which parses and
    # defaults all of it in orchestrator/src/config.ts. Nothing needs listing
    # here, and there is no env file to have by default.
    # Keep it outside the repo with: BOXES_ENV=~/.config/boxes.env
    env_file:
      - path: ${BOXES_ENV:-.env}
        required: false
    environment:
      # Not a default being restated — config.ts has the same one — but the
      # other half of the volume mount below, pinned here so the two cannot
      # disagree. An env file that moved it would put the database somewhere
      # nothing is mounted, and lose it on the next recreate without saying
      # so. Placed after the env file, so it wins.
      - DATA_DIR=/data
    volumes:
      # Root-equivalent access, mitigated by the fixed HostConfig template, by
      # never shell-exec'ing user strings, and by the auth in front.
      - /var/run/docker.sock:/var/run/docker.sock
      - boxes-data:/data
    ports:
      # Loopback by default, because the orchestrator has no authentication of
      # its own: binding it to every interface would publish a
      # root-equivalent control plane to the LAN. A reverse proxy on this host
      # reaches it here. One in a container should join this project's network
      # and address `orchestrator:3000` directly, rather than widening this.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    networks:
      - default
    depends_on:
      - egress-proxy

  egress-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    # Fixed name: the orchestrator attaches this container to every session
    # network by name, and expects this one — it is the default of
    # EGRESS_PROXY_CONTAINER in orchestrator/src/config.ts. Renaming it here
    # means setting that too, or sessions get no egress at all.
    container_name: boxes-egress-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Attached to the compose default network for external egress. The
    # orchestrator dynamically connects it to each session's internal network.
    networks:
      - default

volumes:
  boxes-data:

networks:
  default:
