# Boxes: personal AI agent orchestrator.
#
# The orchestrator creates session containers at runtime, each on an internal
# network of its own, so they appear in no compose file.

name: boxes

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: boxes-orchestrator
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      SESSION_IMAGE: ${SESSION_IMAGE:-boxes-session:latest}
      SESSION_SUBNET_POOL: ${SESSION_SUBNET_POOL:-10.200.0.0/16}
      SESSION_MEM_LIMIT: ${SESSION_MEM_LIMIT:-4g}
      SESSION_CPUS: ${SESSION_CPUS:-2}
      SESSION_PIDS_LIMIT: ${SESSION_PIDS_LIMIT:-512}
      IDLE_STOP_MINUTES: ${IDLE_STOP_MINUTES:-30}
      # Unset means the orchestrator generates one and keeps it in /data.
      WS_AUTH_TOKEN: ${WS_AUTH_TOKEN:-}
      PERMISSION_FALLBACK: ${PERMISSION_FALLBACK:-hold}
      PERMISSION_HOLD_MINUTES: ${PERMISSION_HOLD_MINUTES:-120}
      NTFY_URL: ${NTFY_URL:-}
      EGRESS_PROXY_CONTAINER: boxes-egress-proxy
      PROFILE_DEFAULT_CLAUDE_CODE_OAUTH_TOKEN: ${PROFILE_DEFAULT_CLAUDE_CODE_OAUTH_TOKEN:-}
      PROFILE_DEFAULT_GH_TOKEN: ${PROFILE_DEFAULT_GH_TOKEN:-}
      PROFILE_DEFAULT_GIT_NAME: ${PROFILE_DEFAULT_GIT_NAME:-boxes-bot}
      PROFILE_DEFAULT_GIT_EMAIL: ${PROFILE_DEFAULT_GIT_EMAIL:-boxes-bot@users.noreply.github.com}
    volumes:
      # Root-equivalent access, mitigated by the fixed HostConfig template, by
      # never shell-exec'ing user strings, and by the auth in front.
      - /var/run/docker.sock:/var/run/docker.sock
      - boxes-data:/data
    networks:
      - default
      - traefik
    depends_on:
      - egress-proxy
    labels:
      traefik.enable: "true"
      # Dashboard, API and acp-ui, behind basicauth. This catch-all router
      # hands deep links such as /new and /sessions/:id to the orchestrator's
      # index.html fallback. The explicit priority keeps /ws ahead of it.
      traefik.http.routers.boxes.rule: Host(`${BASE_DOMAIN:-boxes.localhost}`)
      traefik.http.routers.boxes.priority: "10"
      traefik.http.routers.boxes.entrypoints: websecure
      traefik.http.routers.boxes.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.boxes.middlewares: boxes-auth
      traefik.http.routers.boxes.service: boxes
      # /ws carries no basicauth: a browser can neither attach Basic
      # credentials to a WebSocket upgrade nor answer a 401 on one, so the
      # gateway authenticates the upgrade with the bearer.<token> subprotocol.
      traefik.http.routers.boxes-ws.rule: Host(`${BASE_DOMAIN:-boxes.localhost}`) && PathPrefix(`/ws`)
      traefik.http.routers.boxes-ws.priority: "100"
      traefik.http.routers.boxes-ws.entrypoints: websecure
      traefik.http.routers.boxes-ws.tls.certresolver: ${CERT_RESOLVER:-le}
      traefik.http.routers.boxes-ws.service: boxes
      traefik.http.services.boxes.loadbalancer.server.port: "3000"
      traefik.http.middlewares.boxes-auth.basicauth.users: ${BASICAUTH_USERS:-}
      traefik.docker.network: ${TRAEFIK_NETWORK:-traefik}

  egress-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    # Fixed name: the orchestrator connects this container to each session
    # network by name.
    container_name: boxes-egress-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Attached to the compose default network for external egress. The
    # orchestrator dynamically connects it to each session's internal network.
    networks:
      - default

volumes:
  boxes-data:

networks:
  default:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}
