# Boxes: personal AI agent orchestrator.
#
#   docker compose up -d     ->  http://localhost:3000
#
# The orchestrator serves the dashboard, the API and the /ws gateway on one
# published port. To put it on the internet, add a reverse proxy in front.
# That proxy must forward the WebSocket upgrade on /ws.
#
# The orchestrator creates the box containers at runtime, each on its own
# internal network.

name: boxes

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: boxes-orchestrator
    restart: unless-stopped
    # Optional. The orchestrator validates every setting in it and supplies
    # the defaults. Credentials are entered on the settings page instead.
    # Keep it outside the repo with: BOXES_ENV=~/.config/boxes.env
    env_file:
      - path: ${BOXES_ENV:-.env}
        required: false
    volumes:
      # Root-equivalent access, mitigated by the fixed HostConfig template, by
      # never passing user strings to a shell, and by the auth in front.
      - /var/run/docker.sock:/var/run/docker.sock
      # The orchestrator keeps its database, its generated keys and every
      # box's files here. /data is the default of DATA_DIR. To mount the
      # volume elsewhere, set DATA_DIR to match.
      - boxes-data:/data
    # A ceiling, not a budget. The orchestrator buffers a whole attachment
    # upload (MAX_ATTACHMENT_MB) and a whole WebSocket frame (16 MiB) in
    # memory per request, and holds the ACP connections of every running box.
    # A gigabyte is several times a small deployment's steady state.
    #
    # The process limit covers node's own threads and the git processes the
    # review runs.
    mem_limit: 1g
    pids_limit: 512
    ports:
      # Loopback by default, because the orchestrator has no authentication
      # of its own and controls the host's Docker daemon. A reverse proxy on
      # this host reaches it here. A reverse proxy in a container joins this
      # project's network and uses orchestrator:3000 instead.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    networks:
      - default
    depends_on:
      - egress-proxy

  egress-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    # The orchestrator attaches this container to every box network by this
    # name, the default of EGRESS_PROXY_CONTAINER. To rename it, set that
    # variable too, or boxes get no egress at all.
    container_name: boxes-egress-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The default network carries external egress and the control channel
    # the orchestrator pushes the egress policy over. The orchestrator also
    # connects the proxy to each box's internal network at runtime.
    #
    # read_only works because the proxy keeps its policy, its credentials and
    # its CA in memory.
    networks:
      - default
    # The proxy holds no database and no box state, only the in-flight
    # requests of every box. It buffers each one to swap a credential in.
    mem_limit: 512m
    pids_limit: 256

volumes:
  boxes-data:

networks:
  default:
