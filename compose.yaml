# Boxes: personal AI agent orchestrator.
#
#   docker compose up -d     ->  http://localhost:3000
#
# The whole deployment is one published port: the orchestrator serves the
# dashboard, the API and the /ws gateway on it. Putting it on the internet is
# a reverse proxy's job, and no proxy is named here — see README.md, which
# covers the one rule any of them has to follow about /ws.
#
# The orchestrator creates session containers at runtime, each on an internal
# network of its own, so they appear in no compose file.

name: boxes

services:
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: boxes-orchestrator
    restart: unless-stopped
    environment:
      # Two settings this file is entitled to decide, because it is this file
      # that wires them: the data dir is where the volume below is mounted,
      # and the proxy name is the container_name further down. Overriding
      # either from a .env would break that wiring, so neither is a
      # pass-through.
      - DATA_DIR=/data
      - EGRESS_PROXY_CONTAINER=boxes-egress-proxy
      # Everything else is passed through from the environment if set, and
      # left unset otherwise. The defaults live in orchestrator/src/config.ts,
      # which parses all of this at boot; restating them here would only give
      # them somewhere to drift apart. See .env.example for what each does.
      - SESSION_IMAGE
      - SESSION_SUBNET_POOL
      - SESSION_MEM_LIMIT
      - SESSION_CPUS
      - SESSION_PIDS_LIMIT
      - IDLE_STOP_MINUTES
      - WS_AUTH_TOKEN
      - PERMISSION_FALLBACK
      - PERMISSION_HOLD_MINUTES
      - NTFY_URL
      - PROFILE_DEFAULT_CLAUDE_CODE_OAUTH_TOKEN
      - PROFILE_DEFAULT_GH_TOKEN
      - PROFILE_DEFAULT_GIT_NAME
      - PROFILE_DEFAULT_GIT_EMAIL
    volumes:
      # Root-equivalent access, mitigated by the fixed HostConfig template, by
      # never shell-exec'ing user strings, and by the auth in front.
      - /var/run/docker.sock:/var/run/docker.sock
      - boxes-data:/data
    ports:
      # Loopback by default, because the orchestrator has no authentication of
      # its own: binding it to every interface would publish a
      # root-equivalent control plane to the LAN. A reverse proxy on this host
      # reaches it here. One in a container should join this project's network
      # and address `orchestrator:3000` directly, rather than widening this.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    networks:
      - default
    depends_on:
      - egress-proxy

  egress-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    # Fixed name: the orchestrator connects this container to each session
    # network by name.
    container_name: boxes-egress-proxy
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Attached to the compose default network for external egress. The
    # orchestrator dynamically connects it to each session's internal network.
    networks:
      - default

volumes:
  boxes-data:

networks:
  default:
